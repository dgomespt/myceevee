name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: better-sqlite3 ships prebuilt binaries, so no native compile step is needed.
      - run: npm ci --ignore-scripts
      - name: ESLint
        run: npm run lint
      - name: Type-check (astro check)
        run: npm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  image:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only once lint and tests pass.
    needs: [lint, test]
    permissions:
      contents: read
      packages: write # lets the built-in GITHUB_TOKEN publish to ghcr.io; no other secrets are used
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Names the image after this repository (ghcr.io/<owner>/<repo>, lowercased) and picks the tags:
      #   push to main -> latest and sha-<commit>;  tag v1.2.3 -> 1.2.3, 1.2 and sha-<commit>
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # Pull requests (including from forks) only build, so they never need registry access.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
